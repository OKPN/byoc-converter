<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drop Publisher - Local Converter</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#202227">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="画像圧縮ツール">
        <header class="topbar">
          <div>
            <p class="eyebrow">端末内だけで処理するローカル変換スタジオ</p>
            <h1>Drop Publisher</h1>
          </div>
          <div class="topbar-actions" style="display: flex; gap: 8px;">
            <button class="ghost-button" id="clearButton" type="button">クリア</button>
          </div>
        </header>

        <div class="tool-grid">
          <section class="panel input-panel">
            <div class="panel-heading">
              <h2>入力ファイル</h2>
              <div class="heading-actions" style="display: flex; gap: 8px; align-items: center;">
                <button class="ghost-button" id="folderSelectButton" type="button">フォルダを追加</button>
                <span id="fileCount">0件</span>
              </div>
            </div>
            <label class="dropzone" id="dropzone">
              <input id="fileInput" type="file" accept="image/*,audio/*,video/*" multiple>
              <input id="folderInput" type="file" webkitdirectory directory multiple style="display: none;">
              <span class="drop-icon">+</span>
              <strong>画像やフォルダをここにドロップ</strong>
              <span>またはクリックしてファイルを選択</span>
            </label>
            <div class="file-list" id="fileList"></div>
          </section>

          <aside class="panel settings-panel">
            <div class="panel-heading">
              <h2>変換設定</h2>
            </div>

            <label class="field">
              <span>出力形式</span>
              <select id="formatSelect">
                <option value="image/jpeg">JPEG</option>
                <option value="image/webp" selected>WebP</option>
                <option value="image/jxl">JXL</option>
              </select>
            </label>

            <label class="field">
              <span>品質</span>
              <div class="range-row">
                <input id="qualityRange" type="range" min="1" max="100" value="85">
                <output id="qualityOutput">85</output>
              </div>
            </label>

            <label class="field">
              <span>リネーム規則</span>
              <div class="input-clear-wrapper" style="position: relative; width: 100%;">
                <input id="renamePattern" type="text" value="{name}" spellcheck="false" style="padding-right: 28px;">
                <button type="button" id="clearRenamePattern" title="入力をクリア">&times;</button>
              </div>
              <div class="pattern-helpers" style="margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap;">
                <button type="button" class="tag-button" data-insert="{name}">元ファイル名</button>
                <button type="button" class="tag-button" data-insert="{num:2}">連番 (01)</button>
                <button type="button" class="tag-button" data-insert="{num:3}">連番 (001)</button>
                <button type="button" class="tag-button" data-insert="{randam:6}">ランダム (6文字)</button>
              </div>
            </label>

            <div class="metadata-warning" style="margin-top: 16px;">
              <span class="warning-icon">⚠️</span>
              <p>プライバシー保護および軽量化のため、変換後の画像からはExifメタデータがすべて自動削除されます。</p>
            </div>

            <div class="action-buttons-group" style="margin-top: 24px;">
              <button class="primary-button" id="convertButton" type="button" disabled style="min-height: 48px; font-size: 15px; font-weight: bold;">画像を変換する</button>
              <button class="secondary-button" id="convertDownloadButton" type="button" disabled style="min-height: 44px;">変換してダウンロード</button>
            </div>
          </aside>
        </div>

        <section class="panel output-panel">
          <div class="panel-heading">
            <h2>出力ファイル</h2>
            <span id="statusText">待機中</span>
          </div>
          <div class="progress-container">
            <progress id="progressBar" value="0" max="100"></progress>
          </div>
          <div class="output-actions">
            <button class="primary-button" id="zipButton" type="button" disabled>ZIPで一括ダウンロード</button>
          </div>
          <div class="result-list" id="resultList"></div>
        </section>

        <details class="panel settings-accordion" id="postComposerPanel" style="margin: 24px 0;">
          <summary>💬 テキスト作成支援</summary>
          <div class="settings-content" style="padding: 18px; display: flex; flex-direction: column; gap: 12px;">
            <div class="composer-template-row" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px;">
              <label for="templateSelect" style="font-size: 12px; color: var(--muted); white-space: nowrap;">定型文:</label>
              <select id="templateSelect" style="flex: 1; min-width: 120px; height: 36px; border: 1px solid var(--border); border-radius: 6px; background: #17191e; color: var(--text); padding: 0 8px;">
                <option value="">-- 定型文を選択 --</option>
              </select>
              <button class="ghost-button" id="saveTemplateButton" type="button" style="min-height: 36px; padding: 0 12px;">定型文を保存</button>
              <button class="ghost-button danger-button" id="deleteTemplateButton" type="button" style="min-height: 36px; padding: 0 12px; display: none;">削除</button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px;">
              <textarea id="composerTextarea" rows="6" placeholder="ここに投稿テキストを入力してください..." style="width: 100%; border: 1px solid var(--border); border-radius: 6px; background: #17191e; color: var(--text); padding: 12px; resize: vertical; font-family: inherit; font-size: 14px; outline: none;"></textarea>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
              <button class="ghost-button" id="clearComposerButton" type="button" style="min-height: 40px; flex: 1; min-width: 80px;">クリア</button>
              <button class="primary-button" id="copyComposerTextButton" type="button" style="min-height: 40px; flex: 2; margin: 0; min-width: 120px;">文章をコピーする</button>
            </div>
          </div>
        </details>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
